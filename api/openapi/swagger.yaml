basePath: /v1
definitions:
  AddCommentRequest:
    properties:
      article_id:
        description: ArticleID is the ID of a published article.
        example: 0193f0a2-6c1e-7b3d-9a52-3f0f6a1d2c45
        type: string
      body:
        description: Body is 1 to 2000 characters once trimmed, none of them NUL.
        example: Thanks, this helped.
        type: string
    required:
    - article_id
    - body
    type: object
  Article:
    properties:
      body:
        example: The first article.
        type: string
      created_at:
        type: string
      id:
        example: 0193f0a2-6c1e-7b3d-9a52-3f0f6a1d2c44
        type: string
      published_at:
        type: string
      slug:
        example: hello-world
        type: string
      status:
        enum:
        - draft
        - published
        example: draft
        type: string
      title:
        example: Hello, world
        type: string
      updated_at:
        type: string
    type: object
  ArticleList:
    properties:
      items:
        description: Items is an empty array, never null, when the page holds no articles.
        items:
          $ref: '#/definitions/Article'
        type: array
      limit:
        example: 20
        type: integer
      offset:
        example: 0
        type: integer
      total:
        example: 1
        type: integer
    type: object
  ChangePasswordRequest:
    properties:
      current_password:
        example: correct-horse-battery
        type: string
      new_password:
        description: NewPassword is 8 to 72 bytes.
        example: battery-staple-horse
        type: string
    required:
    - current_password
    - new_password
    type: object
  Comment:
    properties:
      article_id:
        example: 0193f0a2-6c1e-7b3d-9a52-3f0f6a1d2c45
        type: string
      author_id:
        example: 0193f0a2-6c1e-7b3d-9a52-3f0f6a1d2c46
        type: string
      author_name:
        description: AuthorName is the display name the author had when writing the
          comment.
        example: Ada
        type: string
      body:
        example: Thanks, this helped.
        type: string
      created_at:
        type: string
      id:
        example: 0193f0a2-6c1e-7b3d-9a52-3f0f6a1d2c44
        type: string
    type: object
  CommentList:
    properties:
      items:
        description: Items is an empty array, never null, when the page holds no comments.
        items:
          $ref: '#/definitions/Comment'
        type: array
      limit:
        example: 20
        type: integer
      offset:
        example: 0
        type: integer
      total:
        example: 1
        type: integer
    type: object
  CreateArticleRequest:
    properties:
      body:
        example: The first article.
        type: string
      slug:
        example: hello-world
        type: string
      title:
        example: Hello, world
        type: string
    required:
    - slug
    - title
    type: object
  FieldError:
    properties:
      field:
        description: Field is the field's JSON name, such as "title".
        type: string
      message:
        description: Message describes the rule; it never contains the submitted value.
        type: string
      rule:
        description: Rule is the validate tag that failed, such as "required".
        type: string
    type: object
  ForgotPasswordRequest:
    properties:
      email:
        example: ada@example.com
        type: string
    required:
    - email
    type: object
  LoginRequest:
    properties:
      email:
        example: ada@example.com
        type: string
      password:
        example: correct-horse-battery
        type: string
    required:
    - email
    - password
    type: object
  LogoutRequest:
    properties:
      refresh_token:
        example: Zx8kQm4pR2v9sT1uW3yA5bC7dE0fG6hJ8kL2mN4pQ6r
        type: string
    required:
    - refresh_token
    type: object
  Problem:
    properties:
      code:
        description: Code is a stable, machine-readable error code such as "slug_taken".
        type: string
      detail:
        type: string
      errors:
        description: Errors lists the invalid fields of a validation problem.
        items:
          $ref: '#/definitions/FieldError'
        type: array
      request_id:
        type: string
      status:
        type: integer
      title:
        type: string
      type:
        type: string
    type: object
  RefreshRequest:
    properties:
      refresh_token:
        example: Zx8kQm4pR2v9sT1uW3yA5bC7dE0fG6hJ8kL2mN4pQ6r
        type: string
    required:
    - refresh_token
    type: object
  RegisterRequest:
    properties:
      display_name:
        description: DisplayName is 1 to 50 characters, none of them a control character.
        example: Ada
        type: string
      email:
        example: ada@example.com
        type: string
      password:
        description: Password is 8 to 72 bytes.
        example: correct-horse-battery
        type: string
    required:
    - display_name
    - email
    - password
    type: object
  ResendVerificationRequest:
    properties:
      email:
        example: ada@example.com
        type: string
    required:
    - email
    type: object
  ResetPasswordRequest:
    properties:
      password:
        description: Password is the new password, 8 to 72 bytes.
        example: battery-staple-horse
        type: string
      token:
        description: Token is the reset token mailed to the account.
        example: Zx8kQm4pR2v9sT1uW3yA5bC7dE0fG6hJ8kL2mN4pQ6r
        type: string
    required:
    - password
    - token
    type: object
  TokenPair:
    properties:
      access_expires_at:
        type: string
      access_token:
        description: 'AccessToken goes with each request as "Authorization: Bearer
          <access_token>" until it expires.'
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      refresh_expires_at:
        type: string
      refresh_token:
        description: 'RefreshToken gets the next pair from POST /auth/refresh, once:
          the refresh spends it.'
        example: Zx8kQm4pR2v9sT1uW3yA5bC7dE0fG6hJ8kL2mN4pQ6r
        type: string
      token_type:
        enum:
        - Bearer
        example: Bearer
        type: string
    type: object
  UpdateArticleRequest:
    properties:
      body:
        example: An edited article.
        type: string
      slug:
        example: hello-again
        type: string
      title:
        example: Hello again
        type: string
    type: object
  User:
    properties:
      created_at:
        type: string
      display_name:
        example: Ada
        type: string
      email:
        example: ada@example.com
        type: string
      id:
        example: 0193f0a2-6c1e-7b3d-9a52-3f0f6a1d2c44
        type: string
      roles:
        description: Roles is an empty array, never null, for a user with no role.
        example:
        - reader
        items:
          type: string
        type: array
      verified:
        description: Verified is true once the user has confirmed their email with
          the code they were sent.
        example: false
        type: boolean
    type: object
  VerifyRequest:
    properties:
      code:
        description: Code is the six digits mailed to the email.
        example: "042917"
        type: string
      email:
        example: ada@example.com
        type: string
    required:
    - code
    - email
    type: object
info:
  contact: {}
  description: 'Minimal REST core: platform packages and the article reference module.'
  license:
    name: MIT
  title: Go REST Boilerplate API
  version: "1.0"
paths:
  /articles:
    get:
      parameters:
      - description: Page size; 0 or none means the server's default (20 unless configured),
          and a value above the server's maximum (100 unless configured) means the
          maximum
        in: query
        minimum: 0
        name: limit
        type: integer
      - description: Articles to skip
        in: query
        minimum: 0
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ArticleList'
        "400":
          description: invalid_query
          schema:
            $ref: '#/definitions/Problem'
      summary: List published articles
      tags:
      - articles
    post:
      consumes:
      - application/json
      parameters:
      - description: The new article
        in: body
        name: article
        required: true
        schema:
          $ref: '#/definitions/CreateArticleRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          headers:
            Location:
              description: /v1/articles/drafts/{id}
              type: string
          schema:
            $ref: '#/definitions/Article'
        "400":
          description: malformed_json
          schema:
            $ref: '#/definitions/Problem'
        "409":
          description: slug_taken
          schema:
            $ref: '#/definitions/Problem'
        "413":
          description: body_too_large
          schema:
            $ref: '#/definitions/Problem'
        "422":
          description: validation_failed, invalid_slug, invalid_title, invalid_body
            or body_too_long
          schema:
            $ref: '#/definitions/Problem'
      summary: Create a draft article
      tags:
      - articles
  /articles/{id}:
    delete:
      parameters:
      - description: Article ID (UUID)
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: not_found
          schema:
            $ref: '#/definitions/Problem'
      summary: Delete an article
      tags:
      - articles
    get:
      parameters:
      - description: Article ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Article'
        "404":
          description: not_found
          schema:
            $ref: '#/definitions/Problem'
      summary: Get a published article
      tags:
      - articles
    patch:
      consumes:
      - application/json
      parameters:
      - description: Article ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: The fields to change
        in: body
        name: changes
        required: true
        schema:
          $ref: '#/definitions/UpdateArticleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Article'
        "400":
          description: malformed_json
          schema:
            $ref: '#/definitions/Problem'
        "404":
          description: not_found
          schema:
            $ref: '#/definitions/Problem'
        "409":
          description: slug_taken or slug_locked
          schema:
            $ref: '#/definitions/Problem'
        "413":
          description: body_too_large
          schema:
            $ref: '#/definitions/Problem'
        "422":
          description: invalid_slug, invalid_title, invalid_body or body_too_long
          schema:
            $ref: '#/definitions/Problem'
      summary: Update an article
      tags:
      - articles
  /articles/{id}/publish:
    post:
      parameters:
      - description: Article ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Article'
        "404":
          description: not_found
          schema:
            $ref: '#/definitions/Problem'
        "409":
          description: already_published
          schema:
            $ref: '#/definitions/Problem'
        "422":
          description: empty_body
          schema:
            $ref: '#/definitions/Problem'
      summary: Publish an article
      tags:
      - articles
  /articles/drafts:
    get:
      parameters:
      - description: Page size; 0 or none means the server's default (20 unless configured),
          and a value above the server's maximum (100 unless configured) means the
          maximum
        in: query
        minimum: 0
        name: limit
        type: integer
      - description: Drafts to skip
        in: query
        minimum: 0
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ArticleList'
        "400":
          description: invalid_query
          schema:
            $ref: '#/definitions/Problem'
      summary: List drafts
      tags:
      - articles
  /articles/drafts/{id}:
    get:
      parameters:
      - description: Article ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Article'
        "404":
          description: not_found
          schema:
            $ref: '#/definitions/Problem'
      summary: Get a draft
      tags:
      - articles
  /auth/login:
    post:
      consumes:
      - application/json
      description: Returns an access token and a refresh token for a verified account.
        Wrong passwords lock the account for a while once too many have been tried.
      parameters:
      - description: The email and password
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/TokenPair'
        "400":
          description: malformed_json
          schema:
            $ref: '#/definitions/Problem'
        "401":
          description: invalid_credentials
          schema:
            $ref: '#/definitions/Problem'
        "403":
          description: email_not_verified
          schema:
            $ref: '#/definitions/Problem'
        "413":
          description: body_too_large
          schema:
            $ref: '#/definitions/Problem'
        "422":
          description: validation_failed
          schema:
            $ref: '#/definitions/Problem'
        "423":
          description: account_locked
          schema:
            $ref: '#/definitions/Problem'
      summary: Sign in
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Revokes the refresh token and every token rotated from the same
        sign-in. An access token stays valid until it expires.
      parameters:
      - description: The refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/LogoutRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: malformed_json
          schema:
            $ref: '#/definitions/Problem'
        "413":
          description: body_too_large
          schema:
            $ref: '#/definitions/Problem'
        "422":
          description: validation_failed
          schema:
            $ref: '#/definitions/Problem'
      summary: Sign out
      tags:
      - auth
  /auth/password/change:
    post:
      consumes:
      - application/json
      description: Sets the new password when the current one is right, revokes every
        refresh token of the account and returns the pair of a new sign-in. A wrong
        current password counts toward the lockout as a failed sign-in does.
      parameters:
      - description: The current and the new password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/TokenPair'
        "400":
          description: malformed_json
          schema:
            $ref: '#/definitions/Problem'
        "401":
          description: unauthenticated or invalid_credentials
          schema:
            $ref: '#/definitions/Problem'
        "404":
          description: not_found
          schema:
            $ref: '#/definitions/Problem'
        "413":
          description: body_too_large
          schema:
            $ref: '#/definitions/Problem'
        "422":
          description: validation_failed
          schema:
            $ref: '#/definitions/Problem'
        "423":
          description: account_locked
          schema:
            $ref: '#/definitions/Problem'
      security:
      - BearerAuth: []
      summary: Change the password
      tags:
      - auth
  /auth/password/forgot:
    post:
      consumes:
      - application/json
      description: Mails a reset token, which replaces the one sent before, when the
        email belongs to a verified account whose last token was issued at least IDENTITY_RESEND_COOLDOWN
        (60s by default) ago. The answer is the same for any email, so it does not
        tell whether an account exists or a token was sent.
      parameters:
      - description: The email of the account
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/ForgotPasswordRequest'
      responses:
        "202":
          description: Accepted
        "400":
          description: malformed_json
          schema:
            $ref: '#/definitions/Problem'
        "413":
          description: body_too_large
          schema:
            $ref: '#/definitions/Problem'
        "422":
          description: validation_failed
          schema:
            $ref: '#/definitions/Problem'
      summary: Ask for a password reset
      tags:
      - auth
  /auth/password/reset:
    post:
      consumes:
      - application/json
      description: Sets the new password with the mailed token, spends the token,
        ends any lockout of the account and revokes every refresh token of the account.
      parameters:
      - description: The token and the new password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: malformed_json
          schema:
            $ref: '#/definitions/Problem'
        "413":
          description: body_too_large
          schema:
            $ref: '#/definitions/Problem'
        "422":
          description: validation_failed or invalid_token
          schema:
            $ref: '#/definitions/Problem'
      summary: Reset the password
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Spends the refresh token and returns the next pair. A token spent
        moments ago, as by another tab refreshing at the same time, is refused and
        changes nothing; a token spent earlier is taken as stolen, and every token
        of its sign-in is revoked.
      parameters:
      - description: The refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/TokenPair'
        "400":
          description: malformed_json
          schema:
            $ref: '#/definitions/Problem'
        "401":
          description: invalid_token
          schema:
            $ref: '#/definitions/Problem'
        "413":
          description: body_too_large
          schema:
            $ref: '#/definitions/Problem'
        "422":
          description: validation_failed
          schema:
            $ref: '#/definitions/Problem'
      summary: Refresh the tokens
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Creates an unverified account with the role reader and mails a
        verification code to its email. The account signs in once the email is verified
        with POST /auth/verification.
      parameters:
      - description: The new account
        in: body
        name: account
        required: true
        schema:
          $ref: '#/definitions/RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/User'
        "400":
          description: malformed_json
          schema:
            $ref: '#/definitions/Problem'
        "409":
          description: email_taken
          schema:
            $ref: '#/definitions/Problem'
        "413":
          description: body_too_large
          schema:
            $ref: '#/definitions/Problem'
        "422":
          description: validation_failed
          schema:
            $ref: '#/definitions/Problem'
      summary: Register an account
      tags:
      - auth
  /auth/verification:
    post:
      consumes:
      - application/json
      description: Marks the email verified when the code is the one mailed to it.
        A wrong code counts as an attempt; an expired code, or one guessed at too
        often, is spent, and the user asks for a new one.
      parameters:
      - description: The email and its code
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/VerifyRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: malformed_json
          schema:
            $ref: '#/definitions/Problem'
        "413":
          description: body_too_large
          schema:
            $ref: '#/definitions/Problem'
        "422":
          description: validation_failed, invalid_code, code_expired or too_many_attempts
          schema:
            $ref: '#/definitions/Problem'
      summary: Verify an email
      tags:
      - auth
  /auth/verification/resend:
    post:
      consumes:
      - application/json
      description: Mails a new code, which replaces the one sent before, when the
        email belongs to an unverified account whose last code was issued at least
        IDENTITY_RESEND_COOLDOWN (60s by default) ago. The answer is the same for
        any email, so it does not tell whether an account exists or a code was sent.
      parameters:
      - description: The email to verify
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/ResendVerificationRequest'
      responses:
        "202":
          description: Accepted
        "400":
          description: malformed_json
          schema:
            $ref: '#/definitions/Problem'
        "413":
          description: body_too_large
          schema:
            $ref: '#/definitions/Problem'
        "422":
          description: validation_failed
          schema:
            $ref: '#/definitions/Problem'
      summary: Ask for a new verification code
      tags:
      - auth
  /comments:
    get:
      description: An article that does not exist or is a draft is not_found, never
        an empty page.
      parameters:
      - description: ID (UUID) of a published article
        in: query
        name: article_id
        required: true
        type: string
      - description: Only the comments of the user with this ID (UUID)
        in: query
        name: author_id
        type: string
      - description: Page size; 0 or none means the server's default (20 unless configured),
          and a value above the server's maximum (100 unless configured) means the
          maximum
        in: query
        minimum: 0
        name: limit
        type: integer
      - description: Comments to skip
        in: query
        minimum: 0
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/CommentList'
        "400":
          description: invalid_query
          schema:
            $ref: '#/definitions/Problem'
        "404":
          description: not_found
          schema:
            $ref: '#/definitions/Problem'
      summary: List the comments on a published article
      tags:
      - comments
    post:
      consumes:
      - application/json
      description: The caller is the author, and the comment keeps the display name
        the author has now. An article that does not exist or is a draft is not_found,
        and so is a caller whose account is gone.
      parameters:
      - description: The article and the text
        in: body
        name: comment
        required: true
        schema:
          $ref: '#/definitions/AddCommentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/Comment'
        "400":
          description: malformed_json
          schema:
            $ref: '#/definitions/Problem'
        "401":
          description: unauthenticated
          schema:
            $ref: '#/definitions/Problem'
        "404":
          description: not_found
          schema:
            $ref: '#/definitions/Problem'
        "413":
          description: body_too_large
          schema:
            $ref: '#/definitions/Problem'
        "422":
          description: validation_failed
          schema:
            $ref: '#/definitions/Problem'
      security:
      - BearerAuth: []
      summary: Comment on a published article
      tags:
      - comments
  /comments/{id}:
    delete:
      description: The comment's author may delete it, and so may an editor; anyone
        else is forbidden.
      parameters:
      - description: Comment ID (UUID)
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "401":
          description: unauthenticated
          schema:
            $ref: '#/definitions/Problem'
        "403":
          description: forbidden
          schema:
            $ref: '#/definitions/Problem'
        "404":
          description: not_found
          schema:
