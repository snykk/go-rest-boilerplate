# Local stack: Postgres, then the migrations once, then the API on :8080. Configuration is passed as
# environment variables only; no .env file is read inside the containers.
services:
  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: app }
    # Checked over TCP: on a new volume the image first runs a socket-only server for initialisation.
    healthcheck: { test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U app -d app"], interval: 3s, timeout: 3s, retries: 20 }
    volumes: [postgres_data:/var/lib/postgresql/data]
  migrate:
    build: { context: .., dockerfile: deployment/Dockerfile }
    entrypoint: ["/app/migrate", "up"]
    environment: { DATABASE_URL: "postgres://app:app@postgres:5432/app?sslmode=disable" }
    depends_on: { postgres: { condition: service_healthy } }
  api:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
      args: { VERSION: "${VERSION:-dev}", COMMIT: "${COMMIT:-}" }
    environment:
      APP_ENV: development
      DATABASE_URL: "postgres://app:app@postgres:5432/app?sslmode=disable"
    ports: ["8080:8080"]
    depends_on: { migrate: { condition: service_completed_successfully } }
    # After SIGTERM, requests get HTTP_SHUTDOWN_TIMEOUT (10s), the components a second more, then the resources
    # up to 10s to close. Docker's default of 10s would kill the process midway.
    stop_grace_period: 25s
volumes:
  postgres_data: {}
