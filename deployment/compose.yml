# Local stack: Postgres, Mailpit, then the migrations once, then the API on :8080. Configuration is passed as
# environment variables only; no .env file is read inside the containers.
#
# Mail: the API sends through Mailpit, a mail server that keeps every message instead of delivering it. The
# container reaches it at mailpit:1025, an API run on the host at localhost:1025; read the messages in its inbox
# at http://localhost:8025.
#
# Seed data: docker compose -f deployment/compose.yml --profile seed up seed --build creates a verified editor and a
# reader (SEED_EDITOR_EMAIL, SEED_EDITOR_PASSWORD, SEED_READER_EMAIL and SEED_READER_PASSWORD set them; the defaults
# are in the README), two published articles, a draft and two comments. It skips what exists, so it can run twice.
# It is for local development only and refuses APP_ENV=production; its image is the separate `seed` target of the
# Dockerfile, which the production image does not contain.
#
# Telemetry: OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318 docker compose -f deployment/compose.yml
# --profile telemetry up --build also starts an OpenTelemetry Collector, which sends traces to Jaeger (UI at
# http://localhost:16686) and prints metrics to its log (docker compose -f deployment/compose.yml logs otel-collector).
services:
  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: app }
    # Checked over TCP: on a new volume the image first runs a socket-only server for initialisation.
    healthcheck: { test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U app -d app"], interval: 3s, timeout: 3s, retries: 20 }
    volumes: [postgres_data:/var/lib/postgresql/data]
  migrate:
    build: { context: .., dockerfile: deployment/Dockerfile }
    entrypoint: ["/app/migrate", "up"]
    environment: { DATABASE_URL: "postgres://app:app@postgres:5432/app?sslmode=disable" }
    depends_on: { postgres: { condition: service_healthy } }
  api:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
      args: { VERSION: "${VERSION:-dev}", COMMIT: "${COMMIT:-}" }
    environment:
      APP_ENV: development
      DATABASE_URL: "postgres://app:app@postgres:5432/app?sslmode=disable"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
      METRICS_EXPORT_INTERVAL: "${METRICS_EXPORT_INTERVAL:-}"
      ADMIN_TOKEN: "${ADMIN_TOKEN:-}"
      MAIL_SMTP_ADDR: mailpit:1025
      # A development value; a deployment sets its own random secret of at least 32 bytes.
      IDENTITY_JWT_SECRET: "${IDENTITY_JWT_SECRET:-development-secret-32-bytes-long}"
    ports: ["8080:8080"]
    depends_on: { migrate: { condition: service_completed_successfully }, mailpit: { condition: service_started } }
    # After SIGTERM, requests get HTTP_SHUTDOWN_TIMEOUT (10s), the components a second more, then the resources
    # up to 10s to close and flush telemetry. Docker's default of 10s would kill the process midway.
    stop_grace_period: 25s
  seed:
    build: { context: .., dockerfile: deployment/Dockerfile, target: seed }
    profiles: [seed]
    environment:
      APP_ENV: development
      DATABASE_URL: "postgres://app:app@postgres:5432/app?sslmode=disable"
      IDENTITY_JWT_SECRET: "${IDENTITY_JWT_SECRET:-development-secret-32-bytes-long}"
      SEED_EDITOR_EMAIL: "${SEED_EDITOR_EMAIL:-}"
      SEED_EDITOR_PASSWORD: "${SEED_EDITOR_PASSWORD:-}"
      SEED_READER_EMAIL: "${SEED_READER_EMAIL:-}"
      SEED_READER_PASSWORD: "${SEED_READER_PASSWORD:-}"
    depends_on: { migrate: { condition: service_completed_successfully } }
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["1025:1025", "8025:8025"]
  otel-collector:
    image: otel/opentelemetry-collector:0.140.0
    profiles: [telemetry]
    volumes: ["./otel-collector.yaml:/etc/otelcol/config.yaml:ro"]
    depends_on: [jaeger]
  jaeger:
    image: jaegertracing/jaeger:2.12.0
    profiles: [telemetry]
    ports: ["16686:16686"]
volumes:
  postgres_data: {}
