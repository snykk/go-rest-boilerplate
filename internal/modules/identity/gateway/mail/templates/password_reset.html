{{define "content"}}

<p style="margin:0 0 16px;padding:12px;background-color:#f4f4f5;border-radius:4px;font-family:'Courier New',Courier,monospace;font-size:14px;word-break:break-all;color:#18181b;">{{.Token}}</p>
