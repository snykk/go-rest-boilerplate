<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Service}}</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f4f5;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f4f4f5;">
  <tr>
    <td align="center" style="padding:24px 12px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;background-color:#ffffff;border:1px solid #e4e4e7;border-radius:8px;">
        <tr>
          <td style="padding:20px 32px;border-bottom:1px solid #e4e4e7;font-family:Helvetica,Arial,sans-serif;font-size:18px;font-weight:bold;color:#18181b;">{{.Service}}</td>
        </tr>
        <tr>
          <td style="padding:32px;font-family:Helvetica,Arial,sans-serif;font-size:16px;line-height:24px;color:#27272a;">
{{template "content" .}}
          </td>
        </tr>
        <tr>
          <td style="padding:16px 32px;border-top:1px solid #e4e4e7;font-family:Helvetica,Arial,sans-serif;font-size:12px;line-height:18px;color:#71717a;">You received this email because this address was used with {{.Service}}. If that was not you, you can ignore it.</td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
