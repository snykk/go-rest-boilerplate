name: Feature request
description: A capability the boilerplate should show, or a change to its layout or its rules.
title: "Feature: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        The core stays minimal: docs/extending.md places most capabilities in a module or a platform package of
        the project that needs them. Say why this one belongs in the boilerplate.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What a project built on the boilerplate cannot do today, or does with too much effort.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would add or change, and where it goes, such as a module, a platform package, internal/app or the docs.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Optional. Other ways you considered, such as following docs/extending.md in your own project.
    validations:
      required: false
