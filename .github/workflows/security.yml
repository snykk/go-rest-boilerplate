name: Security

on:
  schedule:
    - cron: "0 9 * * 1"
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

  gosec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: securego/gosec@v2.30.0
        with:
          args: ./...
